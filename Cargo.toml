[package]
name = "mnn-sys"
version = "0.1.0"
edition = "2021"
description = "Safe Rust bindings to a thin C wrapper around Alibaba MNN. Builds MNN from the vendored submodule at 3rd_party/MNN."
license = "Apache-2.0"

[features]
default = []

# GPU backends
metal = []
opencl = []
opengl = []
vulkan = []
cuda = []
coreml = []

# Build & enable Arm KleidiAI ukernels (SME2 / i8mm). Off by default: the
# kernels only accelerate when (SME2) or (dotprod && i8mm) is present, and
# they target int8-input x int4-weight matmuls. With this feature OFF the
# KleidiAI sources are not compiled at all.
kleidiai = []

[dependencies]
ndarray = "0.16"
libc = "0.2"

[build-dependencies]
cmake = "0.1"
cc = "1.0"
bindgen = "0.69"
